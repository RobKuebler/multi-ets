[project]
name = "multi-ets"
version = "0.1.0"
description = "Exponential smoothing (SES, Holt, Holt-Winters) fit by joint multi-step-ahead loss instead of one-step-ahead residuals."
readme = "README.md"
authors = [
    { name = "Robert Kübler", email = "xgarve@gmail.com" }
]
license = "MIT-0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["forecasting", "time-series", "exponential-smoothing", "holt-winters", "ets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "scipy>=1.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 0.39 is the first sktime with the capability:exogenous tag the adapter sets.
sktime = ["sktime>=0.39"]

[project.urls]
Repository = "https://github.com/RobKuebler/multi-ets"
Issues = "https://github.com/RobKuebler/multi-ets/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "statsmodels>=0.14",
    "ty>=0.0.73",
]
benchmark = [
    "statsforecast>=2.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]
# Own group (not dev) so the core CI matrix runs without sktime; default-groups
# below still installs it locally. Mirrors the `sktime` extra.
sktime = [
    "sktime>=0.39",
]

[build-system]
# setuptools + Cython compile the `_holt_hot` extension on every install
# (setup.py). Building against NumPy 2 yields extensions that also run on
# NumPy 1.x, so the runtime `numpy>=1.26` floor still holds.
# See docs/adr/0005-ship-compiled-wheels.md.
requires = ["setuptools>=77", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_ets = ["py.typed"]

[tool.setuptools.exclude-package-data]
multi_ets = ["*.pyx", "*.c"]

[tool.uv]
default-groups = ["dev", "sktime"]
# Rebuild the editable install when the Cython source or build script changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "src/**/*.pyx" }]

[tool.cibuildwheel]
# Builds every CPython that requires-python allows. Free-threaded and 32-bit
# builds are skipped (scipy ships no wheels for most of them).
skip = ["cp3??t-*", "*-win32", "*_i686"]
environment = { MULTI_ETS_EXTENSION = "required" }
test-requires = ["pytest", "pytest-cov"]
# Fail if the wheel lacks the extension (the hot-loop tests would only skip).
test-command = [
    'python -c "import multi_ets._holt_hot"',
    "pytest {project}/tests/test_holt_hot.py {project}/tests/test_seasonal_hot.py -q -p no:cacheprovider",
]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY", "D", "ANN"]
# ANN401: this module deliberately types numpy-duck-typed values as Any
# rather than chasing precise stubs that don't buy much at this size.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D", "ANN"]
"benchmarks/*" = ["D", "ANN"]
"spikes/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=multi_ets --cov-report=term-missing"

[tool.coverage.run]
source = ["src/multi_ets"]

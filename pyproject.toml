[project]
name = "multi-ets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Garve", email = "xgarve@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.11",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "statsmodels>=0.14",
    "ty>=0.0.73",
]
benchmark = [
    "statsforecast>=2.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[build-system]
# setuptools + Cython compile the `_holt_hot` extension on every install
# (setup.py). Building against NumPy 2 yields extensions that also run on
# NumPy 1.x, so the runtime `numpy>=1.26` floor still holds.
# See docs/adr/0005-ship-compiled-wheels.md.
requires = ["setuptools>=77", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_ets = ["py.typed"]

[tool.setuptools.exclude-package-data]
multi_ets = ["*.pyx", "*.c"]

[tool.uv]
# Rebuild the editable install when the Cython source or build script changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "src/**/*.pyx" }]

[tool.cibuildwheel]
# Builds every CPython that requires-python allows. Free-threaded and 32-bit
# builds are skipped (scipy ships no wheels for most of them).
skip = ["cp3??t-*", "*-win32", "*_i686"]
environment = { MULTI_ETS_EXTENSION = "required" }
test-requires = ["pytest", "pytest-cov"]
# Fail if the wheel lacks the extension (the hot-loop tests would only skip).
test-command = [
    'python -c "import multi_ets._holt_hot"',
    "pytest {project}/tests/test_holt_hot.py {project}/tests/test_seasonal_hot.py -q -p no:cacheprovider",
]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY", "D", "ANN"]
# ANN401: this module deliberately types numpy-duck-typed values as Any
# rather than chasing precise stubs that don't buy much at this size.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D", "ANN"]
"benchmarks/*" = ["D", "ANN"]
"spikes/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=multi_ets --cov-report=term-missing"

[tool.coverage.run]
source = ["src/multi_ets"]

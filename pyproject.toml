[project]
name = "multi-ets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Garve", email = "xgarve@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Compiled Cython hot loop (docs/adr/0001-cython-vs-rust-for-fitting-hot-loop.md,
# docs/adr/0002-optional-compiled-extension.md): pulls in the Cython build tool
# only, NOT a prebuilt wheel -- uv_build cannot compile extension modules, so
# this extra alone does not build `_holt_hot`. See README.md's "Fast (optional
# compiled) backend" section for the manual `setup.py build_ext --inplace`
# step still required after `uv sync --extra fast` / `pip install -e ".[fast]"`.
fast = [
    "cython>=3.0",
    "setuptools>=70",  # needed by src/multi_ets/setup.py's manual `build_ext --inplace` step
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "statsmodels>=0.14",
    "ty>=0.0.73",
]
benchmark = [
    "statsforecast>=2.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY", "D", "ANN"]
# ANN401: this module deliberately types numpy-duck-typed values as Any
# rather than chasing precise stubs that don't buy much at this size.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D", "ANN"]
"benchmarks/*" = ["D", "ANN"]
"spikes/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=multi_ets --cov-report=term-missing"

[tool.coverage.run]
source = ["src/multi_ets"]

[tool.ty.src]
# setup.py imports Cython/setuptools, which are only installed under the
# optional `[fast]` extra (see docs/adr/0002) -- the plain `dev` group ty
# runs under (pre-commit, CI) can't resolve them.
exclude = ["src/multi_ets/setup.py"]

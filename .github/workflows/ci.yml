name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - uses: pre-commit/action@v3.0.1

  test:
    # Compiles the Cython extension on `uv sync` (setup.py); "required" makes a
    # broken compile fail the job instead of silently falling back to NumPy.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MULTI_ETS_EXTENSION: required
      UV_NO_GROUP: sktime  # core suite runs sktime-free; tests/test_sktime.py skips
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python -c "import multi_ets._holt_hot"
      - run: uv run pytest tests/ -q

  test-pure-python:
    # The NumPy fallback used when no wheel matches and compiling fails
    # (docs/adr/0005): installs without the extension and runs the full suite.
    runs-on: ubuntu-latest
    env:
      MULTI_ETS_EXTENSION: skip
      UV_NO_GROUP: sktime
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python -c "import multi_ets.holt as h; assert not h._HOLT_HOT_AVAILABLE"
      - run: uv run pytest tests/ -q

  test-sktime:
    # The sktime adapter, with the sktime dependency group (a default group) installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_sktime.py -q
